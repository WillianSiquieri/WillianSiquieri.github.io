<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jogos</title>
  <style>
    :root { --bg:#f4f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --accent:#2e7dff; --border:rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#11151c; --card:#1a202a; --text:#e8ecf4; --muted:#9aa3b2; --accent:#4f9dff; --border:rgba(255,255,255,.1); }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:32px 16px; }
    main { max-width:560px; margin:0 auto; }
    h1 { font-size:28px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 24px; }
    .game { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--border);
      border-radius:16px; padding:16px; margin-bottom:12px; text-decoration:none; color:inherit;
      box-shadow:0 4px 16px rgba(0,0,0,.06); transition:transform .1s; }
    a.game:active { transform:scale(.98); }
    .icon { font-size:36px; width:56px; height:56px; display:flex; align-items:center; justify-content:center;
      border-radius:14px; background:var(--bg); flex-shrink:0; }
    .name { font-weight:700; font-size:18px; }
    .desc { color:var(--muted); font-size:14px; margin-top:2px; }
    .tag { display:inline-block; font-size:11px; font-weight:700; color:#fff; background:var(--accent);
      border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <main>
    <h1>🎮 Jogos</h1>
    <p class="sub">Jogue no celular ou no computador, direto no navegador.</p>

    <a class="game" href="trace-rider/">
      <div class="icon">🛷</div>
      <div>
        <div class="name">Trace Rider</div>
        <div class="desc">Desenhe a pista e deslize até a bandeira.</div>
      </div>
    </a>

    <a class="game" href="citybloom/">
      <div class="icon">🏙️</div>
      <div>
        <div class="name">CityBloom <span class="tag">EM BREVE</span></div>
        <div class="desc">Construa e faça sua cidade crescer.</div>
      </div>
    </a>
  </main>
</body>
</html>
