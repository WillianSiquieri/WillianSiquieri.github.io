<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a9dcf3">
  <title>CityBloom</title>
  <link rel="preload" href="assets/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fredoka-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
  <script type="importmap">{"imports":{"three":"./js/vendor/three/three.module.min.js","three/addons/":"./js/vendor/three/addons/"}}</script>
</head>
<body>
  <div id="loading" class="loading" data-noemo><div class="logo"><img src="assets/icons/1f338.webp" alt="">City<b>Bloom</b></div><img class="mayor" src="assets/characters/micah/mayor-full.svg" alt=""><div class="bar"><div id="load-bar"></div></div></div>
  <canvas id="city3d"></canvas>
  <canvas id="city"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="pill city-pill" data-act="rename" data-tt="rename" title="Rename"><span class="ri">🏙️</span><span id="hud-city"></span><span class="pen">✏️</span></button>
      <button class="pill level-pill" data-act="levelPill" data-tt="levelsTitle" title="City levels">
        <div class="level-top"><span id="hud-phase">🏡</span><span id="hud-level" class="lvl">Level 1</span></div>
        <div class="xp"><div id="hud-xpbar" class="xp-fill"></div></div>
      </button>
      <div class="pill res"><span class="ri">🪙</span><span id="hud-coins">0</span></div>
      <button class="pill res" data-act="inventory" data-tt="inventory" title="Inventory"><span class="ri">📦</span><span id="hud-storage">0/50</span></button>
    </div>
    <div class="hud-right">
      <button id="btn-menu" class="round menu-btn" data-act="menu" data-tt="menu" title="Menu"><span class="burger"><i></i><i></i><i></i></span><span id="menu-badge" class="badge">!</span></button>
    </div>
  </div>

  <!-- Menu (☰): tudo o que não é Pedidos/Construir fica aqui, para a cidade aparecer -->
  <div id="menu" class="menu">
    <button class="mitem" data-act="missions">🏆<span data-t="missionsTitle">Goals &amp; achievements</span><i id="mi-goals" class="badge">!</i></button>
    <button class="mitem" data-act="daily">🎁<span data-t="dailyTitle">Daily chest</span><i id="mi-daily" class="badge">!</i></button>
    <button class="mitem" data-act="inventory">📦<span data-t="inventory">Inventory</span></button>
    <button class="mitem" data-act="levels">🏙️<span data-t="cityTitle">City &amp; levels</span></button>
    <button class="mitem" data-act="home">🎯<span data-t="center">Center</span></button>
    <button class="mitem" data-act="settings">⚙️<span data-t="settingsLang">Settings &amp; language</span></button>
  </div>

  <!-- Dica de objetivo -->
  <div id="tip" class="tip"><img id="tip-face" class="mini" alt=""><div class="tip-body"><span id="tip-text"></span><span id="tip-sub"></span></div><button id="tip-btn" class="tip-btn"></button></div>

  <!-- Barra inferior -->
  <div class="bottombar">
    <button id="btn-orders" class="bigbtn"><span class="bi">📋</span><span id="lbl-orders">Orders</span><span id="orders-badge" class="badge">0</span></button>
    <button id="btn-build" class="bigbtn primary"><span class="bi">🔨</span><span id="lbl-build">Build</span></button>
  </div>

  <!-- Painel do item tocado -->
  <div id="panel" class="panel">
    <div class="panel-head">
      <span id="panel-title" class="panel-title"></span>
      <button id="panel-move" class="movebtn" data-act="move"></button>
      <button class="close" data-act="closePanel" data-tt="close" aria-label="Close">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
    <div id="panel-actions" class="panel-actions"></div>
  </div>

  <!-- Menus (construir / pedidos) -->
  <div id="sheet" class="sheet">
    <div class="sheet-card">
      <div class="panel-head">
        <span id="sheet-title" class="panel-title"></span>
        <button class="close" data-act="closeSheet" data-tt="close" aria-label="Close">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <!-- Posicionar construção -->
  <div id="placebar" class="placebar">
    <div class="pinfo"><b id="place-name"></b><small id="place-hint" class="phint"></small><div id="place-cost" class="rc"></div></div>
    <button class="btn ghost" data-act="placeCancel">✕</button>
    <button id="place-ok" class="btn primary" data-act="placeOk">✓</button>
  </div>

  <!-- Prefeito Walt Parker: abertura e subir de nível -->
  <div id="modal" class="modal"><div id="modal-body" class="modal-card"></div></div>

  <!-- Nome da cidade -->
  <div id="namebox" class="modal">
    <div class="modal-card">
      <div class="burst">🏙️</div>
      <h2 id="name-title"></h2>
      <p id="name-sub" class="muted"></p>
      <input id="name-input" class="name-input" maxlength="20" autocomplete="off" enterkeyhint="done">
      <button id="name-btn" class="btn primary" data-act="nameSave"></button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/portal.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
