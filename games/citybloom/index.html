<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a9dcf3">
  <title>CityBloom</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="city"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-left">
      <button class="pill city-pill" data-act="rename" title="Renomear"><span class="ri">🏙️</span><span id="hud-city"></span><span class="pen">✏️</span></button>
      <button class="pill level-pill" data-act="levels" title="Níveis">
        <div class="level-top"><span id="hud-phase">🏡</span><span id="hud-level" class="lvl">Nível 1</span></div>
        <div class="xp"><div id="hud-xpbar" class="xp-fill"></div></div>
      </button>
      <div class="pill res"><span class="ri">🪙</span><span id="hud-coins">0</span></div>
      <div class="pill res"><span class="ri">👥</span><span id="hud-pop">0</span></div>
      <div class="pill res"><span class="ri">⭐</span><span id="hud-happy">0</span></div>
      <button class="pill res" data-act="inventory" title="Estoque"><span class="ri">📦</span><span id="hud-storage">0/50</span></button>
    </div>
    <div class="hud-right">
      <button id="btn-settings" class="round small" data-act="settings" title="Configurações">⚙️</button>
      <button id="btn-lang" class="round small" title="Idioma / Language">EN</button>
    </div>
  </div>

  <!-- Baú diário -->
  <button id="btn-daily" class="round gift" data-act="daily" title="Baú diário">🎁<span id="daily-badge" class="badge">!</span></button>

  <!-- Zoom / centralizar -->
  <div class="side">
    <button id="btn-zoom-in" class="round" title="Zoom +">＋</button>
    <button id="btn-zoom-out" class="round" title="Zoom −">－</button>
    <button id="btn-home" class="round" title="Centralizar">🎯</button>
  </div>

  <!-- Dica de objetivo -->
  <div id="tip" class="tip"><img id="tip-face" class="mini" alt=""><span id="tip-text"></span></div>

  <!-- Barra inferior -->
  <div class="bottombar">
    <button id="btn-orders" class="bigbtn"><span class="bi">📋</span><span id="lbl-orders">Pedidos</span><span id="orders-badge" class="badge">0</span></button>
    <button id="btn-build" class="bigbtn primary"><span class="bi">🔨</span><span id="lbl-build">Construir</span></button>
  </div>

  <!-- Painel do item tocado -->
  <div id="panel" class="panel">
    <div class="panel-head">
      <span id="panel-title" class="panel-title"></span>
      <button id="panel-move" class="movebtn" data-act="move"></button>
      <button class="close" data-act="closePanel" aria-label="Fechar">✕</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
    <div id="panel-actions" class="panel-actions"></div>
  </div>

  <!-- Menus (construir / pedidos) -->
  <div id="sheet" class="sheet">
    <div class="sheet-card">
      <div class="panel-head">
        <span id="sheet-title" class="panel-title"></span>
        <button class="close" data-act="closeSheet" aria-label="Fechar">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <!-- Posicionar construção -->
  <div id="placebar" class="placebar">
    <div class="pinfo"><b id="place-name"></b><small id="place-hint" class="phint"></small><div id="place-cost" class="rc"></div></div>
    <button class="btn ghost" data-act="placeCancel">✕</button>
    <button id="place-ok" class="btn primary" data-act="placeOk">✓</button>
  </div>

  <!-- Prefeito Otávio: abertura e subir de nível -->
  <div id="modal" class="modal"><div id="modal-body" class="modal-card"></div></div>

  <!-- Nome da cidade -->
  <div id="namebox" class="modal">
    <div class="modal-card">
      <div class="burst">🏙️</div>
      <h2 id="name-title"></h2>
      <p id="name-sub" class="muted"></p>
      <input id="name-input" class="name-input" maxlength="20" autocomplete="off" enterkeyhint="done">
      <button id="name-btn" class="btn primary" data-act="nameSave"></button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/portal.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
