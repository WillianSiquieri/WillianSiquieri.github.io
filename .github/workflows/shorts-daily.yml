name: Shorts · Ciclo diário

# Gera os shorts do dia a partir das fontes de notícias.
# Roda no fuso ~09:00 BRT (12:00 UTC) e também pode ser disparado manualmente.
on:
  schedule:
    - cron: '0 12 * * *'
  # Reutilizável: cada canal tem um workflow fino que chama este, passando o
  # seu nome. Assim os passos do pipeline ficam num lugar só.
  workflow_call:
    inputs:
      channel:
        type: string
        required: false
        default: 'financeiro'
      count:
        type: string
        required: false
        default: ''
      force:
        type: boolean
        required: false
        default: false
      no_upload:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal (financeiro | biblico)'
        required: false
        default: 'financeiro'
      count:
        description: 'Quantos shorts gerar (sobrescreve a config)'
        required: false
        default: ''
      force:
        description: 'Gerar mesmo com o modo pausado'
        type: boolean
        required: false
        default: false
      no_upload:
        description: 'Não enviar ao YouTube (só render/preview, para testes)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Mesmo grupo do workflow de publicação: os dois gravam em data/ e,
  # rodando juntos, um perdia o push do outro. O grupo inclui o canal, mas
  # todos compartilham o mesmo repositório, então o sufixo é só informativo:
  # o push com rebase é o que de fato protege contra escrita concorrente.
  group: shorts-state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shorts-automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar ffmpeg + fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Rodar ciclo de geração
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_BIBLICO: ${{ secrets.YT_REFRESH_TOKEN_BIBLICO }}
          SA_CHANNEL: ${{ inputs.channel || github.event.inputs.channel || 'financeiro' }}
          IN_COUNT: ${{ inputs.count || github.event.inputs.count }}
          IN_FORCE: ${{ inputs.force || github.event.inputs.force }}
          IN_NO_UPLOAD: ${{ inputs.no_upload || github.event.inputs.no_upload }}
        run: |
          ARGS=""
          if [ -n "$IN_COUNT" ]; then ARGS="$ARGS --count=$IN_COUNT"; fi
          if [ "$IN_FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$IN_NO_UPLOAD" = "true" ]; then ARGS="$ARGS --no-upload"; fi
          echo "canal: $SA_CHANNEL"
          node src/cycle.js $ARGS

      - name: Commitar estado atualizado
        if: always()
        env:
          SA_CHANNEL: ${{ inputs.channel || github.event.inputs.channel || 'financeiro' }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "ciclo diário ($SA_CHANNEL): novos shorts + analytics"
          # Os dois workflows escrevem em data/ e podem rodar juntos. Sem rebase,
          # um push perdido descartava o estado e deixava vídeo órfão no YouTube.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push recusado (tentativa $i) — rebase e tenta de novo"
            git pull --rebase --autostash origin master || exit 1
            sleep $((i * 3))
          done
          git push
